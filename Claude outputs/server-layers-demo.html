<!DOCTYPE html>
<html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Server Layer Steps</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a1a1a;--line:#262626;--fg:#ededed;--muted:rgba(255,255,255,.7);--green:#00ff87}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--fg);font-family:"Space Grotesk",system-ui,sans-serif}
body{background-image:linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:4.27vw 100%;background-attachment:fixed}
.spacer{height:60vh;display:grid;place-items:center;color:#777;font:12px ui-monospace,monospace;letter-spacing:.1em}
.pin{height:450vh;position:relative}
.sticky{position:sticky;top:0;height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{position:relative;width:min(1400px,100%);border:1px solid rgba(255,255,255,.1);padding:40px 56px 48px}
.row{display:flex;align-items:center;gap:40px}
.text{flex:1;min-width:0}
.eyebrow{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.eyebrow img{width:44px}
.eyebrow span{font-size:18px;font-weight:300;color:var(--muted);letter-spacing:-.02em}
.stack{display:grid}.stack>*{grid-area:1/1}
h2{font-size:clamp(40px,6.2vw,96px);line-height:1.05;font-weight:700;max-width:12ch}
p{margin-top:22px;font-size:clamp(16px,1.6vw,24px);color:var(--muted);max-width:34ch;line-height:1.45}
.w{display:inline-block;will-change:opacity,filter,transform}
.bar{margin-top:40px;height:22px;max-width:620px;display:block}
.counter{position:absolute;right:20px;top:16px;font:12px ui-monospace,monospace;color:#777}.counter b{color:var(--green);font-weight:400}
.srv{--w:clamp(200px,26vw,380px);--gap:calc(var(--w)*.19);--lh:calc(var(--w)*256/372);
  position:relative;width:var(--w);height:calc(3*var(--gap) + var(--lh));flex-shrink:0}
.layer{position:absolute;left:50%}
.layer:nth-of-type(1){top:0}.layer:nth-of-type(2){top:var(--gap)}.layer:nth-of-type(3){top:calc(2*var(--gap))}.layer:nth-of-type(4){top:calc(3*var(--gap))}
.v svg{width:100%;height:auto;display:block}
.v{position:relative}
.lit{position:absolute;inset:0;opacity:0}
.halo{position:absolute;left:50%;top:0;width:115%;aspect-ratio:3/1;border-radius:50%;pointer-events:none;opacity:0;
  background:radial-gradient(closest-side,rgba(0,255,135,.35),rgba(0,255,135,0));filter:blur(18px);z-index:0}
.note{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#111;border:1px solid #333;border-radius:8px;padding:8px 12px;font:12px ui-monospace,monospace;color:#aaa;z-index:5;white-space:nowrap}
@media (max-width:760px){.row{flex-direction:column-reverse;gap:16px}.card{padding:24px 20px}.srv{--w:150px}.note{white-space:normal;width:calc(100% - 32px)}}
</style></head><body>

<script>
const STEPS=[
 {h:"You came here to build.",p:"Your next feature. Your first customer. The idea you can't stop thinking about. usectl handles the infrastructure, giving you more time to move your product forward"},
 {h:"Your stacks, in one place.",p:"Run your apps, databases, storage, and background jobs together. Everything stays connected and organized while usectl manages the infrastructure underneath."},
 {h:"Give every project its own space.",p:"Keep your app and the services it depends on together, with their own resources and access settings. In usectl, we call this project space a Machine."},
 {h:"Give every project its own space.",p:"Keep your app and the services it depends on together, with their own resources and access settings. In usectl, we call this project space a Machine."}
];
// which layer (0 = cap … 3 = base) is lit on each step — bottom-up
const ACTIVE_LAYER=[3,2,1,0];
const LIFT=-12, PUSH=8;   // active layer rises a bit, layers below it drop a bit
const HIDDEN={opacity:0,filter:"blur(12px)",y:8};
const $=id=>document.getElementById(id);
const stack=$("stack");
const split=t=>t.split(" ").map(w=>'<span class="w">'+w+'</span>').join(" ");
STEPS.forEach((s,i)=>{const d=document.createElement("div");d.dataset.step=i;
  d.innerHTML="<h2>"+split(s.h)+"</h2><p>"+split(s.p)+"</p>";stack.appendChild(d)});
const words=(i,sel)=>stack.querySelectorAll('[data-step="'+i+'"] '+sel+' .w');
gsap.set(stack.querySelectorAll(".w"),HIDDEN);
gsap.set([...words(0,"h2"),...words(0,"p")],{opacity:1,filter:"blur(0px)",y:0});

const layers=[...document.querySelectorAll(".layer")];
gsap.set(layers,{xPercent:-50});
gsap.set("#halo",{xPercent:-50});

// ---- server: light one layer, dim the others (called together with the text swap) ----
function server(step,instant){
  const a=ACTIVE_LAYER[step],d=instant?0:1;
  layers.forEach((L,i)=>{
    const lit=L.querySelector(".lit"),on=i===a;
    gsap.killTweensOf([L,lit]);
    gsap.to(lit,on?{opacity:1,duration:.7*d,delay:.1*d,ease:"power2.out"}
                  :{opacity:0,duration:.45*d,ease:"power2.in"});
    gsap.to(L,{y:on?LIFT:(i>a?PUSH:0),duration:.8*d,ease:"power3.out"});
  });
  const gap=layers[1].offsetTop,lh=layers[3].offsetHeight;
  gsap.to("#halo",{y:a*gap+lh*.3,opacity:1,duration:.8*d,ease:"power3.out"});
  if(!instant){
    const lit=layers[a].querySelector(".lit");
    gsap.fromTo(lit,{filter:"brightness(1.7) blur(3px)"},{filter:"brightness(1) blur(0px)",duration:.9,ease:"power2.out"});
  }
}

function swap(to,from){
  const same=STEPS[to].h===STEPS[from].h&&STEPS[to].p===STEPS[from].p;
  ["h2","p"].forEach((sel,fi)=>{
    const o=words(from,sel),n=words(to,sel);gsap.killTweensOf([...o,...n]);
    if(same){gsap.set(o,HIDDEN);gsap.set(n,{opacity:1,filter:"blur(0px)",y:0});return}
    gsap.to(o,{opacity:0,filter:"blur(10px)",duration:.3,stagger:.004});
    gsap.fromTo(n,HIDDEN,{opacity:1,filter:"blur(0px)",y:0,duration:.65,ease:"power3.out",stagger:fi?.012:.06,delay:fi?.3:.15});
  });
  server(to,false);   // server layer changes together with the text
}

const bar=$("bar"),NS="http://www.w3.org/2000/svg",ticks=[];
for(let i=0;i<=60;i++){const l=document.createElementNS(NS,"line"),x=1+i*618/60;
  Object.entries({x1:x,x2:x,y1:i%5?12:2,y2:22,stroke:"#555"}).forEach(([k,v])=>l.setAttribute(k,v));bar.appendChild(l);ticks.push(l)}

let cur=0;const pin=$("pin");
function onScroll(){
  const r=pin.getBoundingClientRect(),p=Math.min(1,Math.max(0,-r.top/(r.height-innerHeight)));
  ticks.forEach((t,k)=>t.setAttribute("stroke",k/60<=p?"#00ff87":"#555"));
  const n=Math.min(3,Math.floor(p*4));
  if(n!==cur){swap(n,cur);cur=n;$("cur").textContent="0"+(n+1)}
}
addEventListener("scroll",()=>requestAnimationFrame(onScroll),{passive:true});
addEventListener("resize",()=>server(cur,true));
server(0,true);onScroll();
</script></body></html>
