<!DOCTYPE html>
<html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Infrastructure Flow</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a1a1a;--line:#262626;--fg:#ededed;--muted:rgba(255,255,255,.7);--green:#00ff87}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--fg);font-family:"Space Grotesk",system-ui,sans-serif}
body{background-image:linear-gradient(90deg,var(--line) 1px,transparent 1px),linear-gradient(var(--line) 1px,transparent 1px);background-size:4.27vw 100%,100% 5.94vw;background-attachment:fixed}
.spacer{height:60vh;display:grid;place-items:center;color:#777;font:12px ui-monospace,monospace;letter-spacing:.1em}
.pin{position:relative}
.sticky{position:sticky;top:0;height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{position:relative;width:min(1400px,100%);min-height:min(620px,86vh);border:1px solid rgba(255,255,255,.1);padding:40px 56px 48px;display:flex;flex-direction:column;justify-content:center;background:rgba(26,26,26,.6)}
.row{display:flex;align-items:center;gap:40px}
.text{flex:1;min-width:0}
.eyebrow{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.eyebrow img{width:44px}
.eyebrow span{font-size:18px;font-weight:300;color:var(--muted);letter-spacing:-.02em}
.stack{display:grid}.stack>*{grid-area:1/1}
h2{font-size:clamp(40px,6vw,92px);line-height:1.05;font-weight:700;max-width:13ch}
p{margin-top:22px;font-size:clamp(16px,1.6vw,24px);color:var(--muted);max-width:36ch;line-height:1.45}
.w{display:inline-block;will-change:opacity,filter,transform}
.bar{margin-top:40px;height:22px;width:100%;max-width:620px;display:block}
.counter{position:absolute;right:20px;top:16px;font:12px ui-monospace,monospace;color:#777}.counter b{color:var(--green);font-weight:400}
.phase{position:absolute;left:20px;top:16px;font:11px ui-monospace,monospace;color:#666;letter-spacing:.06em}
/* 2-part server */
.srv{position:relative;width:clamp(200px,30vw,440px);aspect-ratio:568/480;flex-shrink:0}
.part{position:absolute;inset:0}
.part .lit,.part .dark{position:absolute;inset:0}
.cap{z-index:2}
.placeholder{width:clamp(200px,30vw,440px);flex-shrink:0}
/* machine */
.machine{height:220vh;position:relative}
.machine .sticky{flex-direction:column}
.mark{position:relative;display:flex;align-items:center;gap:clamp(12px,1.6vw,28px);padding:clamp(40px,5vw,70px) clamp(40px,4vw,60px)}
.mark img{width:clamp(60px,6.5vw,125px)}
.mark .word{font-size:clamp(64px,7.8vw,150px);font-weight:700;color:#d9d9d9;line-height:1;letter-spacing:-.02em}
.c{display:inline-block;will-change:opacity,filter,transform}
.cross{position:absolute;width:24px;height:24px}
.cross:before,.cross:after{content:"";position:absolute;background:#666}
.cross:before{left:11.5px;top:0;width:1px;height:24px}.cross:after{top:11.5px;left:0;height:1px;width:24px}
.note{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#111;border:1px solid #333;border-radius:8px;padding:8px 12px;font:12px ui-monospace,monospace;color:#aaa;z-index:5;max-width:calc(100% - 32px);text-align:center}
@media (max-width:760px){.row{flex-direction:column-reverse;gap:16px}.card{padding:48px 20px 28px}.srv{width:200px}.placeholder{display:none}}
</style></head><body>

<script>
const T={
 1:{h:"You came here to build.",p:"Your next feature. Your first customer. The idea you can't stop thinking about. usectl handles the infrastructure, giving you more time to move your product forward"},
 2:{h:"Your stacks, in one place.",p:"Run your apps, databases, storage, and background jobs together. Everything stays connected and organized while usectl manages the infrastructure underneath."},
 3:{h:"Give every project its own space.",p:"Keep your app and the services it depends on together, with their own resources and access settings. In usectl, we call this project space a Machine."},
 4:{h:"Give every project its own space.",p:"Keep your app and the services it depends on together, with their own resources and access settings. In usectl, we call this project space a Machine."},
 5:{h:"Run each part independently.",p:"Your frontend, API, and workers can each have their own resources and deploy separately while staying connected inside the same project. In usectl, each running workload is a Pod."},
 6:{h:"Push your code. We'll put it live.",p:"Connect your repository and push your next update. usectl builds it, deploys it, and serves it over HTTPS while the rest of your project keeps running."},
 7:{h:"Give your agent a place to work.",p:"Run AI agents alongside the apps, APIs, databases, and tools they use. Your coding assistant can also deploy updates and inspect logs through the usectl CLI."},
 8:{h:"Give your agent a place to work.",p:"Run AI agents alongside the apps, APIs, databases, and tools they use. Your coding assistant can also deploy updates and inspect logs through the usectl CLI."}
};
const HIDDEN={opacity:0,filter:"blur(12px)",y:8}, VISIBLE={opacity:1,filter:"blur(0px)",y:0};
const $=id=>document.getElementById(id);
const clamp=(v)=>Math.min(1,Math.max(0,v));
const progressOf=el=>{const r=el.getBoundingClientRect();return clamp(-r.top/(r.height-innerHeight))};
const split=t=>t.split(" ").map(w=>'<span class="w">'+w+'</span>').join(" ");

// ---- reusable text stack (same blur-stagger + timings as the approved demo) ----
function makeStack(el,ids){
  ids.forEach((id,i)=>{const d=document.createElement("div");d.dataset.i=i;
    d.innerHTML="<h2>"+split(T[id].h)+"</h2><p>"+split(T[id].p)+"</p>";el.appendChild(d)});
  const words=(i,sel)=>el.querySelectorAll('[data-i="'+i+'"] '+sel+' .w');
  gsap.set(el.querySelectorAll(".w"),HIDDEN);
  gsap.set([...words(0,"h2"),...words(0,"p")],VISIBLE);
  return (to,from)=>{
    const same=T[ids[to]].h===T[ids[from]].h&&T[ids[to]].p===T[ids[from]].p;
    ["h2","p"].forEach((sel,fi)=>{
      const o=words(from,sel),n=words(to,sel);gsap.killTweensOf([...o,...n]);
      if(same){gsap.set(o,HIDDEN);gsap.set(n,VISIBLE);return}
      gsap.to(o,{opacity:0,filter:"blur(10px)",duration:.3,stagger:.004});
      gsap.fromTo(n,HIDDEN,{...VISIBLE,duration:.65,ease:"power3.out",stagger:fi?.012:.06,delay:fi?.3:.15});
    });
  };
}
function makeBar(svg){const NS="http://www.w3.org/2000/svg",t=[];
  for(let i=0;i<=60;i++){const l=document.createElementNS(NS,"line"),x=1+i*618/60;
    Object.entries({x1:x,x2:x,y1:i%5?12:2,y2:22,stroke:"#555"}).forEach(([k,v])=>l.setAttribute(k,v));svg.appendChild(l);t.push(l)}
  return p=>t.forEach((l,k)=>l.setAttribute("stroke",k/60<=p?"#00ff87":"#555"));
}

// ===== A: text 1 -> (scroll) server opens -> text 2 =====
const OPEN_START=.25, OPEN_END=.55, STEP2_AT=.6;       // fractions of pin A
const OPEN_Y_PERCENT=35/480*100;                        // server-2 has the base 35 units lower
const swapA=makeStack($("stackA"),[1,2]), barA=makeBar($("barA"));
let stepA=0;
function serverTo(step){ // step 0: base lit · step 1: cap lit (bottom-up), same timings as demo
  const on=step===0?"#baseLit":"#capLit", off=step===0?"#capLit":"#baseLit";
  gsap.killTweensOf([on,off]);
  gsap.to(off,{opacity:0,duration:.45,ease:"power2.in"});
  gsap.to(on,{opacity:1,duration:.7,delay:.1,ease:"power2.out"});
  gsap.fromTo(on,{filter:"brightness(1.7) blur(3px)"},{filter:"brightness(1) blur(0px)",duration:.9,ease:"power2.out"});
  gsap.to(step===0?"#base":"#cap",{keyframes:[{y:"-=10",duration:.3,ease:"power2.out"},{y:"+=10",duration:.8,ease:"power3.out"}]});
}
function onA(){
  const p=progressOf($("pinA"));
  barA(p);
  const open=gsap.parseEase("power2.inOut")(clamp((p-OPEN_START)/(OPEN_END-OPEN_START)));
  gsap.set("#base",{yPercent:open*OPEN_Y_PERCENT});          // scrubbed: follows scroll
  const s=p>=STEP2_AT?1:0;
  if(s!==stepA){swapA(s,stepA);serverTo(s);stepA=s;$("curA").textContent="0"+(s+1)} // triggered
  $("phaseA").textContent=s?"ტექსტ 2 · ზედ ნაწილ active":open>0.01?"იხსნება… "+Math.round(open*100)+"%":"ტექსტ 1 · ქვედ ნაწილ active";
}

// ===== machine: wordmark blur-in when it reaches the middle =====
$("word").innerHTML="machine".split("").map(c=>'<span class="c">'+c+'</span>').join("");
const chars=document.querySelectorAll("#word .c"), crosses=document.querySelectorAll("#mark .cross");
gsap.set([...chars,"#hatch"],HIDDEN);gsap.set(crosses,{opacity:0,scale:.6});
let machineIn=false;
function onMachine(){
  const r=$("machine").getBoundingClientRect(), inside=r.top<innerHeight*.35&&r.bottom>innerHeight*.65;
  if(inside===machineIn)return; machineIn=inside;
  gsap.killTweensOf([...chars,"#hatch",...crosses]);
  if(inside){
    gsap.to("#hatch",{...VISIBLE,duration:.6,ease:"power3.out"});
    gsap.to(chars,{...VISIBLE,duration:.6,ease:"power3.out",stagger:.04,delay:.15});
    gsap.to(crosses,{opacity:1,scale:1,duration:.5,ease:"power2.out",stagger:.05,delay:.5});
  }else{
    gsap.to([...crosses],{opacity:0,scale:.6,duration:.3});
    gsap.to([...chars,"#hatch"],{...HIDDEN,duration:.3,stagger:.01});
  }
}

// ===== B: texts 3..8 =====
const IDS_B=[3,4,5,6,7,8];
const swapB=makeStack($("stackB"),IDS_B), barB=makeBar($("barB"));
let stepB=0;
function onB(){
  const p=progressOf($("pinB"));barB(p);
  const s=Math.min(IDS_B.length-1,Math.floor(p*IDS_B.length));
  if(s!==stepB){swapB(s,stepB);stepB=s;$("curB").textContent="0"+IDS_B[s]}
}

let raf=0;
addEventListener("scroll",()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;onA();onMachine();onB()})},{passive:true});
onA();onMachine();onB();
</script></body></html>
