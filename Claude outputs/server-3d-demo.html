<!DOCTYPE html>
<html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D Server Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a1a1a;--fg:#ededed;--muted:rgba(255,255,255,.7);--green:#00ff87}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--fg);font-family:"Space Grotesk",system-ui,sans-serif}
body{background-image:linear-gradient(90deg,#262626 1px,transparent 1px);background-size:4.27vw 100%;background-attachment:fixed}
.spacer{height:100vh;display:grid;place-items:center;color:#777;font:12px ui-monospace,monospace;letter-spacing:.1em}
.hero{position:relative;height:460vh}
.sticky{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
#gl{width:min(560px,80vw);height:min(560px,52vh);display:block}
.ref{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:min(560px,52vh);opacity:0;pointer-events:none;transition:opacity .2s}
.stage{position:relative}
.eyebrow{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:18px;font-weight:300;margin-top:6px}
.eyebrow img{width:44px}
h1{font-size:clamp(40px,5.4vw,84px);line-height:1.05;font-weight:700;text-align:center;max-width:16ch;margin-top:6px}
.sub{color:var(--muted);max-width:54ch;text-align:center;font-size:clamp(15px,1.3vw,19px);margin-top:14px}
.hud{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;
  background:#111;border:1px solid #333;border-radius:10px;padding:8px 12px;font:12px ui-monospace,monospace;color:#aaa;z-index:9;max-width:calc(100% - 24px)}
.hud b{color:var(--green);font-weight:400}
.hud button{all:unset;cursor:pointer;padding:6px 10px;border-radius:6px;background:#242424;color:#ddd}
.hud button.on{background:#2f4a3a;color:#c8ffe2}
.track{position:fixed;right:18px;top:50%;transform:translateY(-50%);width:6px;height:40vh;background:#222;border-radius:3px;z-index:9}
.track i{position:absolute;left:0;width:6px;background:var(--green);border-radius:3px;top:0}
.track s{position:absolute;left:-5px;width:16px;height:1px;background:#555}
</style></head><body>
<div class="spacer">↓ SCROLL ↓</div>
<section class="hero" id="hero"><div class="sticky">
  <div class="stage"><canvas id="gl"></canvas><img class="ref" id="ref" alt=""></div>
  <div class="eyebrow"><img id="hatch" alt=""><span>Infrastructure Freedom</span></div>
  <h1>Your infrastructure, unpacked.</h1>
  <p class="sub">ნამდვილ 3D: scroll-ზე შრეები შორდებიან და მოდელ იმავ დროს უწყვეტად ტრიალდება, მერე ერთ ადგილას დგას.</p>
</div></section>
<div class="spacer">შემდეგ სექცი</div>
<div class="track" id="track"><i id="fill"></i><s style="top:65%"></s></div>
<div class="hud">
  <span>open <b id="hOpen">0%</b> · turn <b id="hDeg">0°</b> · <b id="hPhase">…</b></span>
  <button id="bSpin" class="on">ტრიალ</button>
  <button id="bBloom" class="on">glow</button>
  <button id="bRef">ორიგინალ SVG</button>
  <button id="bAuto">auto-spin</button>
</div>

const S=window.serverScene, st=S.state;
// opening and the 360° turn now run together, then the stack just stands there
const MOVE_END=.65;
const clamp=v=>Math.min(1,Math.max(0,v));
const ease=(t)=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;   // power2.inOut
let auto=false;
function frame(){
  const r=$("hero").getBoundingClientRect();
  const p=clamp(-r.top/(r.height-innerHeight));
  const m=ease(clamp(p/MOVE_END));
  st.open=m;
  if(!auto) st.spin=st.spinOn?m:0;
  S.render();
  $("hOpen").textContent=Math.round(st.open*100)+"%";
  $("hDeg").textContent=Math.round(st.spin*360)+"°";
  $("hPhase").textContent=p<MOVE_END?"იხსნება + ტრიალებს":"დგას (დამატებ scroll)";
  $("fill").style.height=(p*100)+"%";
}
addEventListener("scroll",()=>requestAnimationFrame(frame),{passive:true});
addEventListener("resize",()=>{S.resize();frame()});
$("bSpin").onclick=e=>{st.spinOn=!st.spinOn;e.target.classList.toggle("on",st.spinOn);frame()};
$("bBloom").onclick=e=>{st.bloomOn=!st.bloomOn;e.target.classList.toggle("on",st.bloomOn);frame()};
$("bRef").onclick=e=>{const on=$("ref").style.opacity!=="0.55";$("ref").style.opacity=on?"0.55":"0";e.target.classList.toggle("on",on)};
$("bAuto").onclick=e=>{auto=!auto;e.target.classList.toggle("on",auto);if(auto)tick()};
function tick(){if(!auto)return;st.spin=(st.spin+0.0025)%1;S.render();$("hDeg").textContent=Math.round(st.spin*360)+"°";requestAnimationFrame(tick)}
frame();
