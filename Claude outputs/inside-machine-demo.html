<!DOCTYPE html>
<html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inside The Machine</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a1a1a;--fg:#ededed;--muted:rgba(255,255,255,.7);--green:#00ff87}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--fg);font-family:"Space Grotesk",system-ui,sans-serif}
/* same grid as the site: 82px columns / 114px rows at a 1920 reference, 2px lines at 2% white,
   starting from the 99px content inset */
/* one composited fixed layer instead of background-attachment:fixed (which repaints the whole
   page on every scroll frame) */
.grid-lines{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    repeating-linear-gradient(90deg,rgba(255,255,255,.02) 0 2px,transparent 2px 4.27vw),
    repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 2px,transparent 2px 5.94vw);
  background-position:5.156vw 0,0 0}
.spacer{height:80vh;display:grid;place-items:center;color:#777;font:12px ui-monospace,monospace;letter-spacing:.1em}
.pin{position:relative}
.sticky{position:sticky;top:0;height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#1a1a1a;contain:layout paint}

/* inside the machine: no green tint at all — just the site's own dark tone and the same grid
   lines, so being inside reads as a place, not as a colour wash */
.interior{position:absolute;inset:0;opacity:0;will-change:opacity;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.02) 0 2px,transparent 2px 4.27vw),
    repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 2px,transparent 2px 5.94vw),
    radial-gradient(120% 90% at 50% 45%,rgba(255,255,255,.025),rgba(0,0,0,0) 60%),
    #141414;
  background-position:5.156vw 0,0 0,0 0,0 0}
/* a light green wash right after you get inside — it fades out on scroll, well before you reach
   the content */
.tint{position:absolute;inset:0;opacity:0;pointer-events:none;
  background:radial-gradient(110% 80% at 50% 55%,rgba(0,255,135,.14),rgba(0,0,0,0) 65%),
             radial-gradient(80% 50% at 50% 115%,rgba(0,255,135,.16),rgba(0,0,0,0) 70%)}
.walls{position:absolute;inset:0;opacity:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(0,255,135,.16),transparent 12%,transparent 88%,rgba(0,255,135,.16)),
             linear-gradient(0deg,rgba(0,255,135,.10),transparent 16%)}
.mark{position:relative;display:flex;align-items:center;gap:clamp(12px,1.6vw,28px);z-index:3}
.mark img{width:clamp(60px,6.5vw,125px)}
.word{font-size:clamp(64px,7.8vw,150px);font-weight:700;color:#d9d9d9;line-height:1;letter-spacing:-.02em}
.c{display:inline-block;will-change:opacity,filter,transform}
/* The hatch opens as a rounded square (the plate's own inner panel shape): two mask layers — a
   full-cover one and the hole shape — combined with mask-composite:exclude, so only the hole's
   SIZE animates and the shape itself stays a static data URI. */
.plate{position:absolute;left:50%;top:50%;width:min(64vh,52vw);aspect-ratio:1;translate:-50% -50%;z-index:4;
  will-change:transform,opacity,mask-size;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-position:center,center;mask-position:center,center;
  -webkit-mask-composite:xor;mask-composite:exclude}
.plate img{width:100%;height:100%;display:block;backface-visibility:hidden}
.ring{position:absolute;left:50%;top:50%;width:1px;height:1px;border-radius:16%;z-index:5;opacity:0;
  translate:-50% -50%;pointer-events:none;
  box-shadow:0 0 34px 6px rgba(0,255,135,.32);will-change:opacity,width,height}

/* The content that greets you INSIDE — same markup/proportions as the real
   InfrastructureSection card: 85% wide bordered card, hatch + 22px eyebrow, 136px heading,
   32px paragraph, the static progress bar, and the 4-layer server on the right. */
.card{position:absolute;z-index:6;width:85%;border:1px solid rgba(255,255,255,.1);
  padding:32px 64px 56px;opacity:0;will-change:transform,opacity;backface-visibility:hidden}
.row{display:flex;align-items:center;gap:64px}
.col{flex:1;min-width:0}
.eyebrow{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.eyebrow img{width:58px;height:auto}
.eyebrow span{font-size:22px;font-weight:300;line-height:1;letter-spacing:-.02em;color:rgba(255,255,255,.7)}
.stackT{display:grid}.stackT>*{grid-area:1/1}
h2{font-size:136px;line-height:1.05;font-weight:700;max-width:950px;color:#ededed}
p.body{margin-top:24px;font-size:32px;line-height:1.35;color:rgba(255,255,255,.7);max-width:860px}
.w{display:inline-block;will-change:opacity,filter,transform}
/* static bar: the green version is clipped left-to-right over the base one, exactly like
   InfrastructureStaticBar */
.bar{position:relative;margin-top:80px;width:100%;max-width:821px;aspect-ratio:821/35}
.bar img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.bar .fill{position:absolute;inset:0;clip-path:inset(0% 100% 0% 0%)}
.srv{position:relative;width:650px;max-width:34vw;flex-shrink:0}
.srv .stackS{position:relative;margin:0 auto;width:400px;max-width:100%}
.srv .layer{position:absolute;left:50%;translate:-50% 0}
.srv .layer img{width:100%;display:block}
@media (max-width:1799px){h2{font-size:clamp(40px,5.4vw,96px)}p.body{font-size:clamp(16px,1.8vw,24px)}
  .card{padding:24px 40px 40px}.row{gap:40px}.srv{width:320px}.srv .stackS{width:200px}.bar{margin-top:48px}}
@media (max-width:820px){.srv{display:none}}
.counter{position:absolute;right:20px;top:14px;font:12px ui-monospace,monospace;color:#777}.counter b{color:var(--green);font-weight:400}

.hud{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;
  background:#111;border:1px solid #333;border-radius:10px;padding:8px 12px;font:12px ui-monospace,monospace;color:#aaa;z-index:20;max-width:calc(100% - 24px)}
.hud b{color:var(--green);font-weight:400}
.hud button{all:unset;cursor:pointer;padding:6px 10px;border-radius:6px;background:#242424;color:#ddd}
.hud button.on{background:#2f4a3a;color:#c8ffe2}
.track{position:fixed;right:16px;top:50%;transform:translateY(-50%);width:6px;height:38vh;background:#222;border-radius:3px;z-index:20}
.track i{position:absolute;left:0;width:6px;background:var(--green);border-radius:3px;top:0}
.track s{position:absolute;left:-5px;width:16px;height:1px;background:#555}
</style></head><body>
<div class="grid-lines"></div>
<div class="spacer">↓ SCROLL ↓</div>

<!-- ONE pinned scene: machine -> we fly in -> the texts are already inside, no page scroll between -->
<section class="pin" id="scene" style="height:980vh"><div class="sticky">
  <div class="interior" id="interior"></div>
  <div class="tint" id="tint"></div>
  <div class="walls" id="walls"></div>
  <div class="mark" id="mark"><img id="hatch" alt=""><span class="word" id="word"></span></div>
  <div class="plate" id="plate"><img id="plateImg" alt=""></div>
  <div class="ring" id="ring"></div>
  <div class="card" id="card">
    <div class="counter"><b id="cur">03</b> / 08</div>
    <div class="row">
      <div class="col">
        <div class="eyebrow"><img id="hatch2" alt=""><span>Infrastructure Freedom</span></div>
        <div class="stackT" id="stackT"></div>
        <div class="bar"><img id="barBase" alt=""><div class="fill" id="barFill"><img id="barGreen" alt=""></div></div>
      </div>
      <div class="srv"><div class="stackS" id="srv"></div></div>
    </div>
  </div>
</div></section>

<div class="spacer">END</div>
<div class="track" id="track"><i id="fill"></i><s style="top:30%"></s><s style="top:36%"></s><s style="top:58%"></s></div>
<div class="hud">
  <span><b id="hPhase">…</b> · <b id="hInfo"></b></span>
  <button id="bHole" class="on">ხვრელ</button>
  <button id="bWalls">შიდ სინათლ</button>
</div>

const srvEl=$("srv");
LAYERS.forEach((src,i)=>{const d=document.createElement("div");d.className="layer";
  d.style.width=(i===0?CAP*100:100)+"%";d.style.zIndex=10-i;
  const im=document.createElement("img");im.alt="";d.appendChild(im);srvEl.appendChild(d);
  // same reason as the plate: bitmaps scale on the GPU, SVGs re-rasterise at every new scale
  const raw=new Image();
  raw.onload=()=>{const w=766,h=Math.round(766*raw.height/raw.width),c=document.createElement("canvas");
    c.width=w;c.height=h;c.getContext("2d").drawImage(raw,0,0,w,h);
    try{im.src=c.toDataURL("image/png")}catch(e){im.src=src}};
  raw.onerror=()=>{im.src=src};raw.src=src;});
// sized in px, not %: a percentage `top` would resolve against the wrapper's own height, which is
// itself derived from the width — that circular reference collapsed the stack to just the cap.
function sizeServer(){
  const w=srvEl.clientWidth;if(!w)return;
  srvEl.style.height=(3*GAP*w+w*256/372)+"px";
  [...srvEl.children].forEach((d,i)=>{d.style.top=(i*GAP*w)+"px"});
}
sizeServer();
const clamp=v=>Math.min(1,Math.max(0,v));
const HIDDEN={opacity:0,filter:"blur(12px)",y:8}, VISIBLE={opacity:1,filter:"blur(0px)",y:0};
const easeIO=gsap.parseEase("power2.inOut"), easeIn=gsap.parseEase("power2.in"), easeOut=gsap.parseEase("power3.out");
let holeOn=true, wallsOn=false; // side light off by default — cleaner, per feedback

/* ---- phases of the ONE pin (fractions of its scroll) ---- */
// Mirrors the real MachineSection: topside.svg fades in ON TOP of the wordmark at its base scale,
// then the wordmark fades out while topside grows (0.75 -> 1.3) — and from there it keeps growing
// into the "fly through the hatch" move. Content arrives earlier than before.
const WORD_IN=.02, PLATE_IN=.09, PLATE_FULL=.14, WORD_OUT=.14,
      ZOOM_START=.14,   // the plate starts growing the moment the wordmark starts leaving
      ZOOM_END=.36,     // by here we're through the hatch
      CARD_END=.58;     // the content is then flown towards, slowly, on scroll
// The content appears once the hatch is 90% open — derived from the hole curve (hole = t²) rather
// than hardcoded, so it stays correct if the zoom range is retimed.
const CARD_AT_HOLE=.9;
const CARD_START=ZOOM_START+Math.sqrt(CARD_AT_HOLE)*(ZOOM_END-ZOOM_START);
const TOPSIDE_BASE=.75, TOPSIDE_MAX=9;
// steps 3..8 then share everything after ARRIVE_END, inside the same pinned screen

$("word").innerHTML="machine".split("").map(c=>'<span class="c">'+c+'</span>').join("");
const chars=[...document.querySelectorAll("#word .c")];
gsap.set([...chars,"#hatch"],HIDDEN);
gsap.set("#plate",{opacity:0,scale:.55});

const stackT=$("stackT");
const split=t=>t.split(" ").map(w=>'<span class="w">'+w+'</span>').join(" ");
T.forEach((s,i)=>{const d=document.createElement("div");d.dataset.i=i;
  d.innerHTML="<h2>"+split(s.h)+"</h2><p class='body'>"+split(s.p)+"</p>";stackT.appendChild(d)});
const words=(i,sel)=>stackT.querySelectorAll('[data-i="'+i+'"] '+sel+' .w');
gsap.set(stackT.querySelectorAll(".w"),HIDDEN);
gsap.set([...words(0,"h2"),...words(0,"p")],VISIBLE);

let wordShown=false, step=0;
function swap(to,from){
  const same=T[to].h===T[from].h&&T[to].p===T[from].p;
  ["h2","p"].forEach((sel,fi)=>{const o=words(from,sel),n=words(to,sel);gsap.killTweensOf([...o,...n]);
    if(same){gsap.set(o,HIDDEN);gsap.set(n,VISIBLE);return}
    gsap.to(o,{opacity:0,filter:"blur(10px)",duration:.3,stagger:.004});
    gsap.fromTo(n,HIDDEN,{...VISIBLE,duration:.65,ease:"power3.out",stagger:fi?.012:.06,delay:fi?.3:.15})});
}

function frame(){
  const r=$("scene").getBoundingClientRect();
  const p=clamp(-r.top/(r.height-innerHeight));

  // 1) wordmark
  const showWord=p>WORD_IN&&p<WORD_OUT;
  if(showWord!==wordShown){wordShown=showWord;gsap.killTweensOf([...chars,"#hatch"]);
    if(showWord){gsap.to("#hatch",{...VISIBLE,duration:.6,ease:"power3.out"});
      gsap.to(chars,{...VISIBLE,duration:.6,ease:"power3.out",stagger:.04,delay:.12})}
    else gsap.to([...chars,"#hatch"],{...HIDDEN,duration:.3,stagger:.01})}

  // 2+3) ONE continuous move: the plate fades in over the wordmark and then grows without ever
  // pausing — an exponential ramp (constant "speed towards you"), so there's no plateau between
  // "growing a bit" and "flying through it".
  const inT=clamp((p-PLATE_IN)/(PLATE_FULL-PLATE_IN));
  const t=clamp((p-ZOOM_START)/(ZOOM_END-ZOOM_START));
  const scale=TOPSIDE_BASE*Math.pow(TOPSIDE_MAX/TOPSIDE_BASE,Math.pow(t,1.6));
  // The hatch opens ALONGSIDE the growth, from the very start — just slower (a squared curve), so
  // the plate is already big while the opening is still catching up, and the two finish together.
  const hole=holeOn?Math.pow(t,2):0;
  const holePct=hole*80;
  const plateW=$("plate").getBoundingClientRect().width;
  gsap.set("#plate",{opacity:inT*(1-clamp((t-.93)/.07)),scale,
    webkitMaskImage:`linear-gradient(#000,#000), url("${HOLE_SVG}")`,
    maskImage:`linear-gradient(#000,#000), url("${HOLE_SVG}")`,
    webkitMaskSize:`100% 100%, ${holePct}% ${holePct}%`,
    maskSize:`100% 100%, ${holePct}% ${holePct}%`});
  const ringSize=(holePct/100)*plateW;
  gsap.set("#ring",{opacity:hole>0?Math.min(1,hole*2)*(1-clamp((t-.85)/.15)):0,width:ringSize,height:ringSize});
  gsap.set("#interior",{opacity:easeIO(clamp((t-.3)/.4))});
  gsap.set("#walls",{opacity:wallsOn?easeIO(clamp((t-.5)/.4))*.9:0});

  // 4) INSIDE: the moment the hatch is fully open the content is already there — small, far away —
  // and from then on scroll simply flies you towards it, slowly, until it sits at full size.
  const aRaw=clamp((p-CARD_START)/(CARD_END-CARD_START));
  const a=gsap.parseEase("power1.out")(aRaw);
  const cardBlur=Math.max(0,(1-aRaw*3))*10;
  gsap.set("#card",{opacity:Math.min(1,aRaw*4),scale:.52+.48*a,force3D:true,
    filter:cardBlur>0.15?`blur(${cardBlur.toFixed(2)}px)`:"none"});
  // the green wash is strongest right after you're through, and is gone by the time the content
  // has arrived
  gsap.set("#tint",{opacity:(1-gsap.parseEase("power1.in")(clamp(aRaw/.85)))*(p>ZOOM_START*1.5?1:0)});

  // 5) steps 3..8 inside
  gsap.set("#barFill",{clipPath:`inset(0% ${100-100*clamp((p-CARD_END)/(1-CARD_END))}% 0% 0%)`});

  if(p>=CARD_END){
    const s=Math.min(T.length-1,Math.floor((p-CARD_END)/(1-CARD_END)*T.length));
    if(s!==step){swap(s,step);step=s;$("cur").textContent="0"+(s+3)}
  }

  $("hPhase").textContent=p<PLATE_IN?"machine":p<ZOOM_START?"ფირფიტ ჩნდება ზემოდან":p<CARD_START?"ფირფიტ იზრდება":p<CARD_END?"კონტენტთან მივდივართ":"შიგნით ვართ";
  $("hInfo").textContent=p<CARD_END?("scale "+scale.toFixed(1)+" · hole "+Math.round(hole*100)+"% · card "+Math.round(aRaw*100)+"%"):("ტექსტ "+(step+3)+"/8");
  $("fill").style.height=(p*100)+"%";
}
let raf=0;
addEventListener("scroll",()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;frame()})},{passive:true});
addEventListener("resize",()=>{sizeServer();frame()});
$("bHole").onclick=e=>{holeOn=!holeOn;e.target.classList.toggle("on",holeOn);frame()};
$("bWalls").onclick=e=>{wallsOn=!wallsOn;e.target.classList.toggle("on",wallsOn);frame()};
frame();
</script></body></html>
