<!DOCTYPE html>
<html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hero Turn Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a1a1a;--fg:#ededed;--muted:rgba(255,255,255,.7);--green:#00ff87}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--fg);font-family:"Space Grotesk",system-ui,sans-serif}
body{background-image:linear-gradient(90deg,#262626 1px,transparent 1px);background-size:4.27vw 100%;background-attachment:fixed}
.hero{position:relative}
.sticky{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.eyebrow{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:18px;font-weight:300}
.eyebrow img{width:44px}
h1{font-size:clamp(40px,5.6vw,86px);line-height:1.05;font-weight:700;text-align:center;max-width:16ch}
.sub{color:var(--muted);max-width:52ch;text-align:center;font-size:clamp(15px,1.3vw,20px)}
/* stage */
.stage{position:relative;width:clamp(200px,22vw,330px);perspective:1400px}
.face{position:absolute;left:50%;bottom:0;transform-origin:50% 100%;will-change:transform,opacity}
.iso{width:100%}
.iso .layer{position:absolute;left:50%;translate:-50% 0}
/* server-turn.svg is the corner-on view: its body is 0.518 of the file's width, and the object is
   √2 narrower seen corner-on, so the file is drawn at 1.366x the stack width. The file also has
   86/696 of empty glow space under the body, so it's pushed down by that much to share a baseline. */
/* The turned face is a "body box": the same on-screen box the isometric stack occupies, with
   server-turn.svg positioned inside it by its measured body bounds (body = x 137..431, y 15..610
   of the 568x696 file), so both faces line up exactly at the hand-over. */
.turn{overflow:visible}
.turn img{position:absolute;transform-origin:0 0;display:block;max-width:none}
.hud{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;
  background:#111;border:1px solid #333;border-radius:10px;padding:8px 12px;font:12px ui-monospace,monospace;color:#aaa;z-index:9}
.hud b{color:var(--green);font-weight:400}
.hud button{all:unset;cursor:pointer;padding:6px 10px;border-radius:6px;background:#242424;color:#ddd}
.hud button.on{background:#2f4a3a;color:#c8ffe2}
.track{position:fixed;right:18px;top:50%;transform:translateY(-50%);width:6px;height:40vh;background:#222;border-radius:3px;z-index:9}
.track i{position:absolute;left:0;width:6px;background:var(--green);border-radius:3px;top:0}
.track s{position:absolute;left:-5px;width:16px;height:1px;background:#555}
.spacer{height:100vh;display:grid;place-items:center;color:#777;font:12px ui-monospace,monospace;letter-spacing:.1em}
</style></head><body>
<div class="spacer">↓ SCROLL ↓</div>
<section class="hero" id="hero" style="height:420vh"><div class="sticky">
  <div class="stage" id="stage">
    <div class="face iso" id="iso"></div>
    <div class="face turn" id="turn"><img id="turnImg" alt=""></div>
  </div>
  <div class="eyebrow"><img id="hatch" alt=""><span>Infrastructure Freedom</span></div>
  <h1>Your infrastructure, unpacked.</h1>
  <p class="sub">Scroll: the stack opens, then turns a full 360°, then stands still for a while before the page moves on.</p>
</div></section>
<div class="spacer">შემდეგ სექცი</div>

<div class="track" id="track"><i id="fill"></i><s style="top:40%"></s><s style="top:80%"></s></div>
<div class="hud">
  <span>open <b id="hOpen">0%</b> · turn <b id="hDeg">0°</b> · <b id="hPhase">…</b></span>
  <button id="bTurn" class="on">ტრიალ: on</button>
  <button id="bMode">სტილ: 3D</button>
</div>

const $=id=>document.getElementById(id);
$("turnImg").src=A.turn;$("hatch").src=A.hatch;

// ---- iso stack (the hero's 4 layer SVGs, gap-driven like the real hero) ----
const GAP_CLOSED=0.112, GAP_OPEN=0.35;      // fractions of the stack width
const CAP=383/372;
const iso=$("iso");
[0,1,2,3].forEach(i=>{const d=document.createElement("div");d.className="layer";d.dataset.i=i;
  d.style.width=(i===0?CAP*100:100)+"%";d.style.zIndex=10-i;
  d.innerHTML='<img src="'+A["l"+i]+'" style="width:100%;display:block">';iso.appendChild(d)});
const layers=[...iso.querySelectorAll(".layer")];

// ---- phases of the pinned range ----
// Phases of the pinned scroll: open -> spin -> stand still (the extra scroll before the page moves on)
const OPEN_END=0.40;
const TURN_END=0.80;
const TURNS=1;               // full 360
const clamp=v=>Math.min(1,Math.max(0,v));
let useTurn=true, mode3d=true;

function render(){
  const r=$("hero").getBoundingClientRect();
  const p=clamp(-r.top/(r.height-innerHeight));
  const t=clamp(p/OPEN_END);                                   // 0..1 opening
  const s=clamp((p-OPEN_END)/(TURN_END-OPEN_END));             // 0..1 spinning (only once open)
  const eased=gsap.parseEase("power2.inOut")(t);
  const spun=gsap.parseEase("power1.inOut")(s);
  const W=$("stage").clientWidth;
  // The stage is as tall as the fully-open stack, so the layers grow upward off a fixed baseline
  // (same idea as the real hero's --stack-gap-driven height) instead of pushing the text around.
  $("stage").style.height=((3*GAP_OPEN+256/372)*W)+"px";

  // open: layer gap grows
  const gap=(GAP_CLOSED+(GAP_OPEN-GAP_CLOSED)*eased)*W;
  const stackH=3*gap+W*256/372;
  layers.forEach((l,i)=>l.style.top=(i*gap)+"px");
  iso.style.height=stackH+"px";

  // turn: 0 -> 360. The stack is 4-fold symmetric, so every 45° we swap between the isometric
  // artwork and server-turn.svg (the corner-on view) and keep rotating that one — the swap is
  // invisible and two stills are enough for a full spin.
  const deg=useTurn?spun*360*TURNS:0;
  const base=Math.round(deg/45)*45;                 // nearest face orientation
  const showTurn=((base/45)%2+2)%2===1;             // odd multiples of 45° = corner-on artwork
  const delta=deg-base;                             // -22.5 .. 22.5
  const turnEl=$("turn"), isoEl=$("iso");
  // Body box: seen corner-on the object is √2 narrower, and it has to be as tall as the open stack.
  const boxW=W/Math.SQRT2, boxH=stackH;
  turnEl.style.width=boxW+"px"; turnEl.style.height=boxH+"px";
  const img=$("turnImg");
  const imgW=boxW/((431-137)/568);                    // body is 294/568 of the file's width
  const natH=imgW*696/568, k=boxH/(natH*(610-15)/696); // squash Y so the body matches the stack
  img.style.width=imgW+"px";
  img.style.left=(-137/568*imgW)+"px";
  img.style.top=(-15/696*natH*k)+"px";
  img.style.transform=`scaleY(${k.toFixed(3)})`;
  const front=showTurn?turnEl:isoEl, back=showTurn?isoEl:turnEl;
  const tf=d=>`translateX(-50%) ${mode3d?`rotateY(${d}deg)`:`scaleX(${Math.cos(d*Math.PI/180).toFixed(3)})`}`;
  front.style.transform=tf(delta);
  back.style.transform=tf(delta+(showTurn?-45:45));
  // crossfade only right at the hand-over, so most of the time one artwork is fully visible
  const edge=Math.min(1,Math.max(0,(Math.abs(delta)-14)/8.5));
  front.style.opacity=1-edge*0.5; back.style.opacity=edge*0.5;

  $("hOpen").textContent=Math.round(t*100)+"%";
  $("hDeg").textContent=Math.round(deg)+"°";
  $("hPhase").textContent=p<OPEN_END?"იხსნება":p<TURN_END?"ტრიალებს":"დგას (დამატებ scroll)";
  $("fill").style.height=(p*100)+"%";
}
$("bTurn").onclick=e=>{useTurn=!useTurn;e.target.classList.toggle("on",useTurn);e.target.textContent="ტრიალ: "+(useTurn?"on":"off");render()};
$("bMode").onclick=e=>{mode3d=!mode3d;e.target.textContent="სტილ: "+(mode3d?"3D":"scaleX");render()};
addEventListener("scroll",()=>requestAnimationFrame(render),{passive:true});
addEventListener("resize",render);render();
</script></body></html>
