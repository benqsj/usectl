<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>usectl — hero intro demo</title>
<!--
  DEMO ONLY — nothing in src/ uses this file.
  On load, the four pieces of server.glb fall bottom -> top and stack into the closed
  assembly while the usual 24s idle turn keeps running. Approved values: hero-intro-animation.md. Open at /demo-intro.html while
  `npm run dev` is running. The panel (bottom-right) tunes it live; "Copy settings" puts the
  chosen numbers on the clipboard so they can be moved into HeroServerModel.tsx.
-->
<style>
  :root { --background:#1e1d1d; --foreground:#ededed; --brand:#11a32a;
          --s: max(0.66667px, calc(100vw / 1920)); }
  * { box-sizing:border-box; }
  html,body { margin:0; }
  body { background:var(--background); color:var(--foreground); min-height:100vh;
         font-family:"Space Grotesk",system-ui,-apple-system,Segoe UI,sans-serif; overflow-x:hidden; }

  /* ---- hero: same values as HeroSectionClient.tsx ---- */
  .hero { position:relative; display:flex; flex-direction:column; align-items:center;
          padding:64px 24px 112px; text-align:center; }
  .eyebrow-row { display:flex; align-items:center; justify-content:center; gap:12px; }
  .eyebrow { font-size:calc(var(--s)*22); line-height:1; font-weight:300; letter-spacing:-.02em; color:rgba(255,255,255,.7); }
  h1 { margin:4px 0 0; font-size:calc(var(--s)*98); line-height:1.05; font-weight:700; }
  @media (min-width:640px) { h1 { white-space:nowrap; } }
  h1 .brand { color:var(--brand); }
  /* text reveal. Every piece of text that animates is a unit: .u (its box, and the mask when the
     style clips) around .ui (what actually moves). The JS builds them per the "split" setting. */
  #content.pre { visibility:hidden; }
  #content .u { display:inline-block; vertical-align:top; }
  #content .u.blk { display:block; }
  #content .ui { display:inline-block; }
  #content .u.blk > .ui { display:block; }
  #content[data-clip="1"] .u { overflow:hidden; padding:.06em .03em .16em; margin:-.06em -.03em -.16em; }
  #content .word { display:inline-block; white-space:nowrap; }
  #content .btn { display:inline-block; }   /* so the button's own padding is part of the moving box */
  #content[data-clip="1"] .btns .u { padding:4px 4px 8px; margin:-4px -4px -8px; }
  #panel h4 { margin:10px 0 2px; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:#8ee89c; }
  #panel .speed.t { margin-top:4px; }
  .sub { max-width:calc(var(--s)*1080); margin:8px auto 0; font-size:calc(var(--s)*28); color:rgba(255,255,255,.7); }
  .btns { margin-top:calc(var(--s)*35); display:flex; flex-wrap:wrap; gap:16px; align-items:center; justify-content:center; }
  .btn { border:1px solid rgba(255,255,255,.25); border-radius:999px; padding:14px 28px; font-size:18px;
         color:#fff; text-decoration:none; }
  .btn.primary { background:var(--brand); border-color:var(--brand); }

  /* ---- the cube wrapper: same box as the real one ---- */
  #cubeWrapper { position:relative; margin:calc(var(--s)*84) auto 0; width:calc(var(--s)*480);
                 --core-height:calc(var(--s)*330.32); --stack-gap:calc(var(--s)*45);
                 height:calc(3 * var(--stack-gap) + var(--core-height)); }
  #glow { position:absolute; left:50%; width:170%; height:calc(var(--s)*130);
          border-radius:50%; filter:blur(24px); pointer-events:none; opacity:0;
          top:calc(3 * var(--stack-gap) + var(--core-height) - 45px);
          transform:translateX(-50%);
          background:radial-gradient(ellipse at center, rgba(72,144,72,.55) 0%, rgba(72,144,72,0) 70%); }
  #stage { position:absolute; left:50%; transform:translate(-50%,-50%); pointer-events:none; }
  #stage canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }

  /* ---- tuning panel ---- */
  #panel { position:fixed; right:16px; bottom:16px; z-index:50; width:280px; max-width:calc(100vw - 32px);
           font:12px/1.4 ui-sans-serif,system-ui,sans-serif; color:rgba(255,255,255,.85);
           background:rgba(18,18,18,.88); border:1px solid rgba(255,255,255,.12); border-radius:12px;
           padding:12px 14px; backdrop-filter:blur(8px); }
  #panel { max-height:calc(100vh - 32px); overflow-y:auto; overscroll-behavior:contain; }
  #panel.min .body { display:none; }
  #panel .top { display:flex; align-items:center; gap:8px; }
  #panel .top b { flex:1; font-size:13px; }
  #panel button { font:inherit; color:#fff; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18);
                  border-radius:8px; padding:5px 10px; cursor:pointer; }
  #panel button.primary { background:var(--brand); border-color:var(--brand); }
  #panel .body { margin-top:10px; display:grid; gap:7px; }
  #panel label { display:grid; grid-template-columns:1fr 44px; gap:2px 8px; align-items:center; }
  #panel label > span:first-child { grid-column:1 / -1; color:rgba(255,255,255,.6); }
  #panel label output { text-align:right; font-variant-numeric:tabular-nums; }
  #panel input[type=range] { width:100%; accent-color:var(--brand); }
  #panel select { font:inherit; width:100%; color:#fff; background:#222; border:1px solid rgba(255,255,255,.18);
                  border-radius:8px; padding:5px 6px; }
  #panel .check { display:flex; gap:8px; align-items:center; }
  #panel .row { display:flex; gap:8px; }
  #panel .row button { flex:1; }
  #panel .speed { margin-top:10px; padding:10px; border-radius:10px; background:rgba(17,163,42,.12);
                   border:1px solid rgba(17,163,42,.35); }
  #panel .speed .head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
  #panel .speed .head span { color:rgba(255,255,255,.75); }
  #panel .speed .head b { font-size:18px; font-variant-numeric:tabular-nums; }
  #panel .speed .bar { display:flex; gap:6px; align-items:center; }
  #panel .speed .bar button { width:30px; padding:4px 0; font-size:15px; }
  #panel .speed .chips { display:flex; gap:6px; margin-top:8px; }
  #panel .speed .chips button { flex:1; padding:4px 0; }
  #panel .speed .chips button.on { background:var(--brand); border-color:var(--brand); }
  #grab { position:absolute; inset:-4% -12%; z-index:5; cursor:grab; touch-action:pan-y; user-select:none; }
  #hud { position:fixed; left:12px; bottom:12px; z-index:50; font:12px/1.5 ui-monospace,monospace;
         color:rgba(255,255,255,.55); }
</style>
<script type="importmap">

    "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",

<body>
<main>
  <section class="hero">

      <div id="glow"></div>

<div id="panel">
  <div class="top">
    <b>Server intro — demo</b>
    <button id="replay" class="primary" title="R">↻ თავიდან</button>
    <button id="toggle" title="ჩაკეცვა">–</button>
  </div>
  <div class="speed">
    <div class="head"><span>ანიმაციის სიჩქარე</span><b id="speedVal">1.00×</b></div>
    <div class="bar">
      <button id="slower" title="ნელა">−</button>
      <input type="range" id="speedRange" min="0.25" max="2" step="0.05" style="flex:1" />
      <button id="faster" title="სწრაფად">+</button>

      <button data-s="0.5">0.5×</button><button data-s="0.75">0.75×</button>
      <button data-s="1">1×</button><button data-s="1.5">1.5×</button>
    </div>
  </div>
  <div class="body">
    <h4>სერვერი</h4>
    <div id="sliders"></div>
    <label class="check"><input type="checkbox" id="ring" /> კონტურის ხაზი საერთოდ დამალე</label>

    <h4>ტექსტი</h4>
    <label class="check"><input type="checkbox" id="text" checked /> ტექსტის ანიმაცია ჩართულია</label>
    <label><span>მზა ვარიანტები</span>
      <select id="textPreset" style="grid-column:1 / -1"></select>
    </label>
    <div class="speed t">
      <div class="head"><span>ტექსტის სიჩქარე</span><b id="tSpeedVal">1.00×</b></div>
      <div class="bar">
        <button id="tSlower" title="ნელა">−</button>
        <input type="range" id="tSpeedRange" min="0.25" max="3" step="0.05" style="flex:1" />
        <button id="tFaster" title="სწრაფად">+</button>
      </div>
      <div class="chips">
        <button data-t="0.5">0.5×</button><button data-t="1">1×</button>
        <button data-t="1.5">1.5×</button><button data-t="2">2×</button>
      </div>
    </div>
    <label><span>როდის გამოვიდეს</span>
      <select id="textWhen" style="grid-column:1 / -1">
        <option value="after">სერვერის აწყობის შემდეგ (cap-ის დაჯდომისას)</option>
        <option value="mid">შუაში (მე-2 დეტალის დაჯდომისას)</option>
        <option value="with">სერვერთან ერთად (პირველივე დეტალთან)</option>
        <option value="pieces">დეტალებთან ერთად — ყოველ დაჯდომაზე ერთი სტრიქონი</option>
        <option value="before">ჯერ ტექსტი, მერე სერვერი</option>
      </select>
    </label>
    <label><span>ანიმაციის სტილი</span>
      <select id="textStyle" style="grid-column:1 / -1">
        <option value="up">Mask — ამოსვლა ქვემოდან</option>
        <option value="down">Mask — ჩამოსვლა ზემოდან</option>
        <option value="skew">Mask — ამოსვლა დახრით</option>
        <option value="fadeUp">ნაზად ამოსვლა + გამოჩენა</option>
        <option value="fade">უბრალო გამოჩენა (fade)</option>
        <option value="left">Mask — შემოსვლა მარცხნიდან</option>
        <option value="blur">ბუნდოვნიდან გამოჩენა</option>
        <option value="wipe">მარცხნიდან გადაშლა</option>
        <option value="wipeCenter">შუიდან გადაშლა</option>
        <option value="scale">გადიდებით გამოჩენა (pop)</option>
        <option value="flip">3D გადმობრუნება</option>
        <option value="type">საბეჭდი მანქანა</option>
      </select>
    </label>
    <label><span>რა ნაწილებად შემოვიდეს</span>
      <select id="textSplit" style="grid-column:1 / -1">
        <option value="block">სტრიქონებად (eyebrow → სათაური → აბზაცი → ღილაკები)</option>
        <option value="words">სიტყვა-სიტყვა</option>
        <option value="letters">ასო-ასო</option>
      </select>
    </label>
    <label><span>თანმიმდევრობა</span>
      <select id="textOrder" style="grid-column:1 / -1">
        <option value="top">ზემოდან ქვემოთ</option>
        <option value="bottom">ქვემოდან ზემოთ</option>
        <option value="together">ყველა ბლოკი ერთად (ბლოკის შიგნით სათითაოდ)</option>
        <option value="random">შემთხვევითი</option>
      </select>
    </label>
    <label><span>მოძრაობის ხასიათი (easing)</span>
      <select id="textEase" style="grid-column:1 / -1">
        <option value="expo">რბილი დამუხრუჭება</option>
        <option value="smooth">გლუვი</option>
        <option value="back">პატარა გადაცილებით (back)</option>
        <option value="inout">ნელა-სწრაფად-ნელა</option>
        <option value="linear">თანაბარი</option>
      </select>
    </label>
    <div id="textSliders"></div>
    <button id="textOnly">▶ მხოლოდ ტექსტის ანიმაცია</button>

    <button id="reset">ნაგულისხმევზე დაბრუნება</button>
    <button id="copy">Copy settings</button>
    <div style="color:rgba(255,255,255,.5)">სერვერი მაუსით გადაატრიალე: აქეთ-იქით და ზემოთ-ქვემოთ.</div>
  </div>
</div>
<div id="hud">loading…</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

/* ===== same constants as src/lib/heroModel.ts ========================================== */
const MODEL_URL = '/herosection/3D/server.glb';
const BASE_WIDTH_PX = 400, PX_PER_UNIT = 1045;
const STAGE_W = 1.7, STAGE_H = 2.75;
const START_YAW_DEG = 45, REST_ELEVATION_DEG = 35;
const ROTATION_SECONDS = 24, RESUME_TAU_S = 0.9;

/* bottom -> top: the four pieces that fall, in the order they land. */
const LAYER_NAMES = ['04_base', '03_core', '02_core', '01_cap'];
/* The neon outline under the base. It does not fall: it fades in the moment the base lands
   (or stays hidden altogether with the checkbox). */
const RING_NAME = '05_accent_ring';

/* ===== tunables (all editable from the panel) ===========================================
   speed  — plays the whole intro faster/slower
   height — how far above its resting place each piece starts (world units; 1 ≈ 1045px @400)
   dur    — seconds one piece takes to fall
   gap    — seconds between one piece starting and the next. Smaller than `dur` means the next
            one is already falling before the previous lands, so they chase each other down.
   twist  — degrees a piece turns while falling, 0 on landing (0 = no extra turning)
   wobble — degrees a piece rocks while falling, straightening out exactly as it lands
   squash — how much a piece squashes on landing (1 - squash tall for a moment). It squashes
            DOWN into what's under it, so nothing ever moves up after landing.               */
// approved 2026-09-21 — see hero-intro-animation.md
const DEFAULTS = { speed: 1, height: 0.3, dur: 0.62, gap: 0.4, wobble: 10, squash: 0.08, twist: 0, delay: 0.25, fade: 0.3,
                   textSpeed: 1, textOffset: -1.3, textDur: 0.8, blockGap: 0.14, unitGap: 0.06, distance: 110, blur: 8 };
/* text choices (the selects); the preset list below sets these together with the text sliders */
const TEXT_DEFAULTS = { when: 'after', style: 'up', split: 'words', order: 'top', ease: 'expo' };
const SLIDERS = [
  ['dur',    'ერთი დეტალის ვარდნის დრო (წმ)',      0.12, 1.2, 0.01],
  ['gap',    'ინტერვალი დეტალებს შორის (წმ)',      0.03, 0.8, 0.01],
  ['height', 'საიდან ვარდება (სიმაღლე)',           0.1,  0.9, 0.01],
  ['wobble', 'რხევა ვარდნისას (°)',               0,    25,  1],
  ['squash', 'დაჯდომისას ჩაჯდომა (რბილი დარტყმა)', 0,    0.2, 0.01],
  ['twist',  'ტრიალი ვარდნისას (°)',              0,    180, 5],
];
const TEXT_SLIDERS = [
  ['textOffset', 'დაყოვნება არჩეული მომენტიდან (წმ, − = უფრო ადრე)', -2, 2, 0.05],
  ['textDur',    'ერთი ნაწილის ანიმაციის ხანგრძლივობა (წმ)',       0.05, 2.5, 0.05],
  ['blockGap',   'ინტერვალი სტრიქონებს შორის (წმ)',               0, 0.8, 0.01],
  ['unitGap',    'ინტერვალი სიტყვებს / ასოებს შორის (წმ)',          0, 0.3, 0.005],
  ['distance',   'საიდან ამოდის (%)',                             10, 250, 5],
  ['blur',       'ბუნდოვნება (px)',                               0, 30, 1],
];
const TEXT_PRESETS = [
  ['Mask — სიტყვებით ამოსვლა',   { style: 'up', split: 'words', order: 'top', ease: 'expo', textDur: 0.8, blockGap: 0.14, unitGap: 0.06, distance: 110 }],
  ['Mask — ასოებით ამოსვლა',     { style: 'up', split: 'letters', order: 'top', ease: 'expo', textDur: 0.6, blockGap: 0.12, unitGap: 0.018, distance: 110 }],
  ['Mask — სტრიქონებით',          { style: 'up', split: 'block', order: 'top', ease: 'expo', textDur: 0.9, blockGap: 0.16, unitGap: 0, distance: 110 }],
  ['Mask — დახრით, სიტყვებით',    { style: 'skew', split: 'words', order: 'top', ease: 'expo', textDur: 0.9, blockGap: 0.12, unitGap: 0.05, distance: 120 }],
  ['Mask — ზემოდან ჩამოსვლა',     { style: 'down', split: 'words', order: 'top', ease: 'expo', textDur: 0.8, blockGap: 0.12, unitGap: 0.05, distance: 110 }],
  ['ბუნდოვნიდან, სიტყვებით',      { style: 'blur', split: 'words', order: 'top', ease: 'smooth', textDur: 1.0, blockGap: 0.12, unitGap: 0.04, distance: 60, blur: 10 }],
  ['მარცხნიდან გადაშლა',          { style: 'wipe', split: 'block', order: 'top', ease: 'inout', textDur: 1.0, blockGap: 0.15, unitGap: 0 }],
  ['3D გადმობრუნება, ასოებით',     { style: 'flip', split: 'letters', order: 'top', ease: 'back', textDur: 0.7, blockGap: 0.1, unitGap: 0.02 }],
  ['Pop, სიტყვებით',               { style: 'scale', split: 'words', order: 'together', ease: 'back', textDur: 0.6, blockGap: 0.05, unitGap: 0.05 }],
  ['საბეჭდი მანქანა',              { style: 'type', split: 'letters', order: 'top', ease: 'linear', textDur: 0.05, blockGap: 0.15, unitGap: 0.025 }],
  ['დეტალებთან ერთად, სტრიქონებით', { when: 'pieces', style: 'up', split: 'block', order: 'top', ease: 'expo', textDur: 0.9, textOffset: 0 }],
  ['დეტალებთან ერთად, სიტყვებით',   { when: 'pieces', style: 'up', split: 'words', order: 'top', ease: 'expo', textDur: 0.7, unitGap: 0.05, textOffset: 0 }],
  ['ჯერ ტექსტი, მერე სერვერი',       { when: 'before', style: 'up', split: 'words', order: 'top', ease: 'expo', textDur: 0.8, blockGap: 0.12, unitGap: 0.05 }],
  ['მარცხნიდან შემოსვლა, სიტყვებით', { style: 'left', split: 'words', order: 'top', ease: 'expo', textDur: 0.8, blockGap: 0.12, unitGap: 0.05, distance: 110 }],
];

const Q = new URLSearchParams(location.search);
const P = { ...DEFAULTS };
for (const [k] of [...SLIDERS, ...TEXT_SLIDERS]) if (Q.has(k)) P[k] = Number(Q.get(k));

const wrapper = document.getElementById('cubeWrapper');
const stage = document.getElementById('stage');
const glow = document.getElementById('glow');
const content = document.getElementById('content');
const hud = document.getElementById('hud');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ===== three: identical to HeroServerModel.tsx ========================================== */
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.8;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.3;

const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, -10, 10);
let elevation = REST_ELEVATION_DEG;
const placeCamera = () => {
  const e = THREE.MathUtils.degToRad(elevation);
  camera.position.set(0, Math.sin(e), Math.cos(e)).multiplyScalar(4); camera.lookAt(0, 0, 0);
};
placeCamera();

const addLight = (l, x, y, z) => { l.position.set(x, y, z); scene.add(l); return l; };
addLight(new THREE.DirectionalLight(0xffffff, 1.15), 2, 3.5, 2);
addLight(new THREE.DirectionalLight(0xbfd8ff, 0.3), -3, 1.5, -1.5);

const clamp01 = (x) => Math.min(Math.max(x, 0), 1);

const EASE = {
  in:    (u) => u * u,                                        // gravity: slow start, fast landing
  out:   (u) => 1 - Math.pow(1 - u, 4),                       // decelerates onto the stack

const easeOutCubic = (u) => 1 - Math.pow(1 - u, 3);

/* ---- pointer: sideways spins (with a throw), up/down tilts — copied from HeroServerModel ---- */
const ELEV_MIN = 4, ELEV_MAX = 78, ELEV_DEG_PER_PX = 0.25, MAX_THROW = 14;
const grab = document.getElementById('grab');

const dragRadPerPx = () => (Math.PI * 2) / Math.max(stage.clientWidth * 1.2, 1);
grab.addEventListener('pointerdown', (e) => {

});

  elevation = THREE.MathUtils.clamp(elevation + (e.clientY - lastY) * ELEV_DEG_PER_PX, ELEV_MIN, ELEV_MAX);

const endDrag = (e) => {

const unit = (child, block = false) => {
  const u = document.createElement(block ? 'div' : 'span'); u.className = block ? 'u blk' : 'u';
  const ui = document.createElement(block ? 'div' : 'span'); ui.className = 'ui';
  ui.append(child); u.append(ui);

};

/** Rebuilds the copy split into units; returns them grouped per block, in reading order. */
let builtSplit = null;
let groups = [];
function buildText(split) {
  content.textContent = '';
  groups = [];
  for (const b of BLOCKS) {
    const el = document.createElement(b.tag); if (b.cls) el.className = b.cls;
    const units = [];
    b.parts.forEach((part, pi) => {
      if (part.el) {                       // logo, buttons: always one unit each
        if (split === 'block') el.append(part.el());
        else { const { u, ui } = unit(part.el()); el.append(u); units.push(ui); }
        return;
      }
      const holder = part.cls ? Object.assign(document.createElement('span'), { className: part.cls }) : document.createDocumentFragment();
      const words = part.text.split(' ');
      words.forEach((w, wi) => {
        if (split === 'block') holder.append(w);
        else if (split === 'words') { const { u, ui } = unit(document.createTextNode(w)); holder.append(u); units.push(ui); }
        else {
          const word = document.createElement('span'); word.className = 'word';
          for (const ch of w) { const { u, ui } = unit(document.createTextNode(ch)); word.append(u); units.push(ui); }
          holder.append(word);
        }
        if (wi < words.length - 1) holder.append(' ');
      });
      el.append(holder);
      if (b.tag === 'h1' && pi < b.parts.length - 1) el.append(' ');
    });
    if (split === 'block') { const { u, ui } = unit(el, true); content.append(u); units.push(ui); }
    else content.append(el);
    groups.push(units);
  }
  builtSplit = split;
}

function keyframes(style) {
  const D = P.distance, B = P.blur;
  switch (style) {
    case 'up':         return [{ transform: `translateY(calc(${D}% + 12px))` }, { transform: 'translateY(0)' }];
    case 'down':       return [{ transform: `translateY(calc(-${D}% - 12px))` }, { transform: 'translateY(0)' }];
    case 'skew':       return [{ transform: `translateY(calc(${D}% + 12px)) skewY(12deg)` }, { transform: 'translateY(0) skewY(0)' }];
    case 'fadeUp':     return [{ opacity: 0, transform: `translateY(${D * 0.4}%)` }, { opacity: 1, transform: 'translateY(0)' }];
    case 'blur':       return [{ opacity: 0, filter: `blur(${B}px)`, transform: `translateY(${D * 0.3}%)` }, { opacity: 1, filter: 'blur(0px)', transform: 'translateY(0)' }];
    case 'wipe':       return [{ clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)' }];
    case 'wipeCenter': return [{ clipPath: 'inset(0 50% 0 50%)' }, { clipPath: 'inset(0 0% 0 0%)' }];
    case 'scale':      return [{ opacity: 0, transform: 'scale(.4)' }, { opacity: 1, transform: 'scale(1)' }];
    case 'flip':       return [{ opacity: 0, transform: 'perspective(600px) rotateX(-95deg)' }, { opacity: 1, transform: 'perspective(600px) rotateX(0deg)' }];
    case 'type':       return [{ opacity: 0 }, { opacity: 1 }];
    case 'fade':       return [{ opacity: 0 }, { opacity: 1 }];
    case 'left':       return [{ transform: `translateX(calc(-${D}% - 12px))` }, { transform: 'translateX(0)' }];
  }
}

/** Seconds (intro time) from the chosen moment, and the order units go in. */
let textEnd = 0;
function schedule() {
  const n = LAYER_NAMES.length;
  // relative delay of every unit, in text-time seconds
  let list = [];
  const order = TEXT.order();
  const gs = order === 'bottom' ? [...groups].reverse().map((g) => [...g].reverse()) : groups;
  // one after another: a line starts once the previous line's last word/letter has started + blockGap
  let cursor = 0;
  const perPiece = TEXT.when() === 'pieces';
  gs.forEach((g, gi) => {
    // "with the pieces": line gi comes in as piece gi lands (in text time, from the first landing)
    const start = perPiece ? (landOf(Math.min(gi, n - 1)) - landOf(0)) * P.textSpeed : order === 'together' ? 0 : cursor;
    g.forEach((ui, k) => list.push({ ui, d: start + k * P.unitGap }));
    cursor = start + Math.max(0, g.length - 1) * P.unitGap + P.blockGap;
  });
  if (order === 'random' && !perPiece) {
    let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    const shuffled = list.map((x) => x.ui).sort(() => rnd() - 0.5);
    list = shuffled.map((ui, k) => ({ ui, d: k * Math.max(P.unitGap, 0.01) }));
  }
  const tLen = (Math.max(0, ...list.map((x) => x.d)) + P.textDur) / P.textSpeed;   // text-only length
  serverShift = TEXT.when() === 'before' ? Math.max(0, tLen + P.textOffset) : 0;
  const anchor = { after: landOf(n - 1), mid: landOf(1), with: startOf(0), pieces: landOf(0), before: P.delay }[TEXT.when()] + P.textOffset;
  textEnd = Math.max(0, anchor) + tLen;
  return { list, anchor: Math.max(0, anchor) };
}

let textAnims = [];
function startText(fromNow = false) {
  textAnims.forEach((a) => a.cancel()); textAnims = [];
  if (builtSplit !== TEXT.split()) buildText(TEXT.split());
  content.classList.remove('pre');
  content.dataset.clip = CLIPPING[TEXT.style()] ? '1' : '0';
  const { list, anchor } = schedule();
  if (!textOn()) { serverShift = 0; textEnd = 0; return; }
  const frames = keyframes(TEXT.style());
  const k = 1000 / P.speed;
  for (const { ui, d } of list) {
    ui.style.transformOrigin = TEXT.style() === 'flip' ? '50% 100%' : '';
    textAnims.push(ui.animate(frames, {
      duration: (P.textDur / P.textSpeed) * k,
      delay: ((fromNow ? 0 : anchor) + d / P.textSpeed) * k,
      easing: TEXT.style() === 'type' ? 'steps(1, end)' : EASINGS[TEXT.ease()],
      fill: 'both',
    }));
  }
}
const hideText = () => startText(false);
function playText() { /* timing lives in the animations themselves (see startText) */ }

function finishIntro() {
  introOn = false;
  if (reduced) textAnims.forEach((a) => a.finish());
  for (const L of layers) { L.node.position.y = L.baseY; L.node.rotation.set(0, 0, 0); L.node.scale.set(1, 1, 1); L.node.visible = true; }
  ring.node.visible = !ringHidden();
  setMaterialsTransparent(false);
  for (const L of [...layers, ring]) for (const e of L.mats) if (e.emissive != null) e.m.emissiveIntensity = e.emissive;
  ringLight.intensity = ringHidden() ? 0 : RING_LIGHT_BASE;
  glow.style.opacity = 1; glow.style.transform = 'translateX(-50%)';
}

function applyIntro(t) {
  const n = layers.length;
  let flash = 0, landed = 0;
  for (let i = 0; i < n; i++) {
    const L = layers[i];
    const u = (t - startOf(i)) / P.dur;
    let off = 0, alpha = 1, twist = 0, tx = 0, tz = 0, sy = 1, sxz = 1;
    if (u < 1) {
      const uu = clamp01(u);
      off = P.height * (1 - uu * uu);                      // gravity: speeds up into the landing
      const settle = 1 - easeOutCubic(uu);                 // 1 at the top -> 0 on landing
      const dir = i % 2 ? 1 : -1;
      twist = THREE.MathUtils.degToRad(P.twist) * dir * settle;
      // rocks like it's swinging on the way down, and is perfectly level when it touches
      const w = THREE.MathUtils.degToRad(P.wobble) * settle;
      tx = w * Math.sin(uu * Math.PI * 2.2 + i);
      tz = w * dir * Math.cos(uu * Math.PI * 1.7 + i * 0.7);
      alpha = smooth(u / P.fade);
    } else {
      landed++;
      const tau = (u - 1) * P.dur;
      // soft landing: squashes into the stack and settles, never lifting off it
      const k = tau < 0.32 ? Math.sin((tau / 0.32) * Math.PI) * Math.exp(-tau / 0.16) : 0;
      sy = 1 - P.squash * k;
      sxz = 1 + P.squash * 0.45 * k;
      // stays exactly where it landed; only a short light pulse marks the landing
      flash += flashCurve((u - 1) * P.dur) * (i === n - 1 ? 1.6 : 0.7);
    }
    L.node.position.y = L.baseY + off;
    L.node.rotation.set(tx, twist, tz);
    L.node.scale.set(sxz, sy, sxz);
    L.node.visible = alpha > 0.002;
    for (const e of L.mats) e.m.opacity = e.opacity * alpha;
  }
  // the outline doesn't fall: it lights up under the base as the base lands
  const ra = ringHidden() ? 0 : smooth((t - landOf(0)) / 0.25);
  ring.node.visible = ra > 0.002;
  for (const e of ring.mats) e.m.opacity = e.opacity * ra;

  ringLight.intensity = (ringHidden() ? 0 : RING_LIGHT_BASE * ra) + 3.2 * flash;
  for (const L of [...layers, ring]) for (const e of L.mats) if (e.emissive != null) e.m.emissiveIntensity = e.emissive * (1 + 0.8 * flash);
  const g = landed ? 0.25 + 0.75 * (landed / n) : 0;
  glow.style.opacity = Math.min(1, g + 0.35 * flash).toFixed(3);
  glow.style.transform = `translateX(-50%) scale(${(0.75 + 0.25 * (landed / n) + 0.06 * flash).toFixed(3)})`;
  return landed;
}

/* ===== loop =============================================================================== */
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (!ready) return;
  if (forcedT == null && turntable && !dragging) {
    // relax the VELOCITY toward the idle turn, so a throw slows down and hands back smoothly
    omega += (restingOmega() - omega) * (1 - Math.exp(-dt / RESUME_TAU_S));
    turntable.rotation.y += omega * dt;
    if (Math.abs(elevation - REST_ELEVATION_DEG) > 0.01) {
      elevation += (REST_ELEVATION_DEG - elevation) * (1 - Math.exp(-dt / RESUME_TAU_S));
      placeCamera();
    }
  }
  if (introOn) {
    const t = forcedT ?? ((performance.now() - introT0) / 1000) * P.speed;
    const landed = applyIntro(t);
    if (forcedT != null) textAnims.forEach((an) => { an.pause(); an.currentTime = (t * 1000) / P.speed; });
    hud.textContent = `t = ${t.toFixed(2)}s · landed ${landed}/4`;
    if (t >= introLength() && forcedT == null) { finishIntro(); hud.textContent = 'done — R ან ↻ თავიდან სანახავად'; }
  }
  renderer.render(scene, camera);
});

new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).load(MODEL_URL, (gltf) => {
  const root = gltf.scene;
  holder.add(root);
  turntable = root.getObjectByName('turntable') ?? root;
  turntable.rotation.y = THREE.MathUtils.degToRad(START_YAW_DEG);
  cap = root.getObjectByName('01_cap');

  const clip = gltf.animations.find((a) => a.name === 'explode_sequence') ?? gltf.animations[0];
  mixer = new THREE.AnimationMixer(root);
  explode = mixer.clipAction(clip);
  explode.play(); explode.paused = true; explodeDur = clip.duration;

  // Per-layer materials: the GLB shares materials between layers, and each layer has to fade on
  // its own. Cloned once here; the real component would dispose them with everything else.
  for (const name of [...LAYER_NAMES, RING_NAME]) {
    const node = root.getObjectByName(name);
    const mats = [], seen = new Map();
    node.traverse((o) => {
      if (!o.isMesh) return;
      const list = Array.isArray(o.material) ? o.material : [o.material];
      const cloned = list.map((m) => {
        if (!seen.has(m)) {
          const c = m.clone(); seen.set(m, c);
          const lit = c.emissive && c.emissive.getHex() !== 0;
          mats.push({ m: c, opacity: c.opacity, emissive: lit ? c.emissiveIntensity : null });
        }
        return seen.get(m);
      });
      o.material = Array.isArray(o.material) ? cloned : cloned[0];
    });
    layers.push({ node, baseY: 0, mats });
  }
  ring = layers.pop();

  capClosedY = cap ? cap.position.y : 0;
  holder.position.y = 0; holder.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(root);
  closedCentreY = (box.max.y + box.min.y) / 2;
  setProgress(0);
  resize();
  ready = true;
  hud.textContent = 'ready';
  // hide everything before the first frame so nothing flashes closed first
  for (const L of [...layers, ring]) L.node.visible = false;
  if (!Q.has('paused')) playIntro();
});

tRange.addEventListener('change', () => startText(true));
document.getElementById('tSlower').onclick = () => setTextSpeed(P.textSpeed - 0.1);
document.getElementById('tFaster').onclick = () => setTextSpeed(P.textSpeed + 0.1);
tChips.forEach((c) => (c.onclick = () => setTextSpeed(Number(c.dataset.t))));
setTextSpeed(P.textSpeed, false);
document.getElementById('copy').onclick = async (e) => {
  const clean = { ...P, text: textOn() ? Object.fromEntries(selects.map((k) => [k, TEXT[k]()])) : 'off' };
  const txt = JSON.stringify({ ...clean, hideRing: ringHidden() });
  try { await navigator.clipboard.writeText(txt); e.target.textContent = 'Copied ✓'; }
  catch { prompt('Settings:', txt); }
  setTimeout(() => (e.target.textContent = 'Copy settings'), 1500);
};
addEventListener('keydown', (e) => { if (e.key === 'r' || e.key === 'R') playIntro(); });

// deterministic hook for frame captures: __seek(seconds)
window.__seek = (t) => {
  if (!introOn) playIntro();
  forcedT = t; if (turntable) turntable.rotation.y = THREE.MathUtils.degToRad(START_YAW_DEG) + restingOmega() * t / P.speed;
};
</script>
</body>
